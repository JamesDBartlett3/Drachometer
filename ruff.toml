# Lint config for CI (see .github/workflows/ci.yml).
# Deliberately narrow: the codebase intentionally uses broad exception handlers
# around network/DB best-effort paths, so only correctness-oriented rules run
# (pyflakes + real errors). Style is not enforced.
[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Re-exports kept intentionally for API compatibility.
"drachometer_mesh.py" = ["F401"]
